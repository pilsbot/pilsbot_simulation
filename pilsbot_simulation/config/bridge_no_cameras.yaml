# ros_gz_bridge parameter_bridge with cameras:=false: bridge.yaml without the
# cameras, whose sensors are not in the URDF then.
# test/test_bridge_config.py checks it against the URDF.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: ignition.msgs.Clock
  direction: GZ_TO_ROS
