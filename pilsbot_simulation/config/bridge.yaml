# ros_gz_bridge: Gazebo -> ROS only. /clock and the sensors of
# pilsbot_description's hardware:=gazebo URDF (pilsbot.gazebo.urdf.xacro lists
# their gz topics), under the robot's topic names.
# test/test_bridge_config.py checks this file against the URDF.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: ignition.msgs.Clock
  direction: GZ_TO_ROS

# OAK-D Lite (names of the Humble pilsbot_depthai mjpeg_node)
- ros_topic_name: /camera/color/image_raw
  gz_topic_name: camera/color/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: ignition.msgs.Image
